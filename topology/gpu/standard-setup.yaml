apiVersion: v1
kind: Namespace
metadata:
  name: standard
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: all-gpus
  namespace: standard
spec:
  spec:
    devices:
      requests:
        - name: req-0
          exactly:
            deviceClassName: gpu.nvidia.com
            allocationMode: All
